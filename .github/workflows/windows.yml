name: Windows

on:
  push:
    branches: [main]
    paths: ["windows/**", "LICENSE", "PRIVACY.md", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "LICENSE", "PRIVACY.md", ".github/workflows/windows.yml"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Same script contributors run locally: restore, build (warnings are errors), test, publish, zip.
      - name: Build, test and package
        shell: pwsh
        run: ./windows/build.ps1

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: HeadsetStats-win-x64
          path: artifacts/*.zip
          if-no-files-found: error
