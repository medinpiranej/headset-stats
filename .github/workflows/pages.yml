name: Website

# Publishes site/ to GitHub Pages, adding the screenshots and logos from docs/ and windows/packaging/
# so the images live in one place. Enable once: repo Settings → Pages → Source: GitHub Actions.
# Runs on every push to main (including merged pull requests), and manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/img
          cp -r site/* _site/
          cp docs/screenshots/*.png docs/tray-icons.png _site/img/
          cp docs/store/store-device-dark.png _site/img/
          cp windows/packaging/Assets/Square150x150Logo.png _site/img/logo.png
          cp windows/packaging/Assets/Square44x44Logo.png _site/img/favicon.png

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
